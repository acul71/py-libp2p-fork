[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "my-libp2p-file-sharing"
version = "0.1.0"
description = "A file sharing application using py-libp2p"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "ForgivenID", email = "your.email@example.com" }
]
dependencies = [
    # Use py-libp2p from main branch (latest features)
    "libp2p-git @ git+https://github.com/libp2p/py-libp2p.git@main",

    # Or use a specific commit for stability:
    # "libp2p-git @ git+https://github.com/libp2p/py-libp2p.git@abc123def456...",

    # Additional dependencies you might need
    "trio>=0.26.0",
    "click>=8.0.0",  # For CLI interface
    "rich>=10.0.0",  # For pretty terminal output
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-trio>=0.5.2",
    "black>=22.0.0",
    "ruff>=0.11.0",
    "mypy>=1.15.0",
]

[project.scripts]
file-share = "my_file_sharing.main:main"

[tool.setuptools.packages.find]
include = ["my_file_sharing*"]

[tool.black]
line-length = 88
target-version = ['py310']

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
